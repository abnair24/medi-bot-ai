[pytest]
# All importable backend code lives under backend/ — src/, ingestion/, evals/ resolve
# as `from src...`, `from ingestion...`, `from evals...` with backend/ on sys.path.
pythonpath = backend

# Eval tests live under backend/evals/, so `pytest` with no args finds them.
testpaths = backend/evals

# Async eval tests use asyncio.run() directly (not the asyncio marker), so no auto mode.
asyncio_mode = strict
